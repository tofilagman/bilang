name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build the
# installers and publish them as a GitHub Release. "Run workflow" by hand builds
# them as downloadable artifacts only, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version (and check the tag matches it)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/* && ${GITHUB_REF#refs/tags/} != "v$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match Cargo.toml version $version"
            exit 1
          fi

  mac:
    name: macOS .dmg
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 and libadwaita
        run: brew install gtk4 libadwaita adwaita-icon-theme
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Bilang.app and the .dmg
        run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: target/Bilang-*.dmg

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nsis
      - name: Build the installer and the portable zip
        run: packaging/windows/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/Bilang-*-setup.exe
            target/Bilang-*.zip

  deb:
    name: Linux .deb
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, libadwaita and ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build the .deb
        run: |
          cargo deb --locked
          mkdir -p dist
          cp target/debian/bilang_*.deb "dist/Bilang-${{ needs.version.outputs.version }}-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    name: Linux Flatpak
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # flatpak-builder installs quickly with dnf (Ubuntu's apt can stall on it);
    # privileged so its bubblewrap sandbox works inside the container
    container:
      image: fedora:43
      options: --privileged
    steps:
      - name: Install flatpak-builder
        run: |
          dnf -y install flatpak flatpak-builder git
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/checkout@v4
      # The GNOME SDK and Rust extension are ~1.5 GB; keep them between releases
      - uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-gnome51-${{ hashFiles('packaging/linux/io.r3al.bilang.yml') }}
          restore-keys: flatpak-gnome51-
      - name: Build the Flatpak bundle
        run: |
          flatpak-builder --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir packaging/linux/io.r3al.bilang.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "dist/Bilang-${{ needs.version.outputs.version }}-linux-x86_64.flatpak" io.r3al.bilang
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak

  android:
    name: Android tablet APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # Android only installs an update signed with the same key as the app
      # already on the tablet, so releases need the real key from the secrets
      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No ANDROID_KEYSTORE secret, so the APK is signed with a throwaway debug key and can't update an earlier install"
          fi
      - name: Build the APK
        run: |
          flutter build apk --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Bilang-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, mac, windows, deb, flatpak, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Bilang ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download Bilang

            | Computer | File |
            |---|---|
            | **Windows** (64-bit) | `Bilang-${{ needs.version.outputs.version }}-windows-x64-setup.exe` (or the portable `.zip`) |
            | **Mac** (Apple silicon: M1 or newer) | `Bilang-${{ needs.version.outputs.version }}-mac-arm64.dmg` |
            | **Ubuntu 24.04+ / Debian 13+** | `Bilang-${{ needs.version.outputs.version }}-linux-amd64.deb` |
            | **Any Linux** (Flatpak) | `Bilang-${{ needs.version.outputs.version }}-linux-x86_64.flatpak` |
            | **Android tablet** (Android 7+) | `Bilang-${{ needs.version.outputs.version }}-android.apk` |

            **First launch:** Bilang isn't signed by Apple or Microsoft yet, so your computer will ask before opening it once.
            - **Windows:** if SmartScreen says "Windows protected your PC", click **More info → Run anyway**.
            - **Mac:** drag Bilang to Applications, then **right-click (or Control-click) Bilang → Open → Open**.
            - **Ubuntu:** `sudo apt install ./Bilang-*-linux-amd64.deb`
            - **Flatpak:** `flatpak install --user Bilang-*.flatpak` (the GNOME runtime comes from Flathub).
            - **Android:** open the `.apk` on the tablet and allow your browser or Files app to **install unknown apps** when asked.
