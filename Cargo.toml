[workspace]
members = [".", "core"]
# The tablet app's bridge crate builds on its own (for Android), with its own lock file.
exclude = ["tablet/rust"]

[package]
name = "bilang"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Bilang: a math adventure for kids, from counting to algebra, with a helper owl and step-by-step hints"
homepage = "https://github.com/tofilagman/bilang"
repository = "https://github.com/tofilagman/bilang"
authors = ["tofi lagman"]

[dependencies]
bilang-core = { path = "core" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
pangocairo = "0.22"
cpal = "0.18.2"
directories = "6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The app icon inside bilang.exe (needs windres, which MSYS2's gcc brings).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
