[package]
name = "bilang"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bilang: a math adventure for kids, from counting to algebra, with a helper owl and step-by-step hints"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
cpal = "0.18.2"
directories = "6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
