[package]
name = "bilang"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Bilang: a math adventure for kids, from counting to algebra, with a helper owl and step-by-step hints"
homepage = "https://github.com/tofilagman/bilang"
repository = "https://github.com/tofilagman/bilang"
authors = ["tofi lagman"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
cpal = "0.18.2"
directories = "6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The app icon inside bilang.exe (needs windres, which MSYS2's gcc brings).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Linux .deb (cargo deb), for Ubuntu 24.04+ / Debian 13+; dependencies come from
# the system (GTK 4, libadwaita, ALSA) via $auto.
[package.metadata.deb]
name = "bilang"
maintainer = "tofi lagman <https://github.com/tofilagman/bilang>"
copyright = "2026, tofi lagman"
license-file = ["LICENSE", "0"]
section = "games"
priority = "optional"
depends = "$auto"
extended-description = """\
Kiko the owl guides children from counting to algebra, with hands-on lessons, \
step-by-step hints, stacked (column) arithmetic like in school, and a score \
sheet for parents. Works offline, with no accounts or ads."""
assets = [
    ["target/release/bilang", "usr/bin/", "755"],
    ["packaging/linux/io.r3al.bilang.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.r3al.bilang.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/icon.svg", "usr/share/icons/hicolor/scalable/apps/io.r3al.bilang.svg", "644"],
]
